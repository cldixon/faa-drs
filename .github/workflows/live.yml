name: Live API

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked --group dev
      - name: Fail if the secret is missing
        env:
          DRS_API_KEY: ${{ secrets.DRS_API_KEY }}
        run: test -n "$DRS_API_KEY" || { echo "::error::Set the DRS_API_KEY repository secret."; exit 1; }
      - run: uv run pytest -m live -v
        env:
          DRS_API_KEY: ${{ secrets.DRS_API_KEY }}
